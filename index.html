<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Playtron experimental musical interface"
    >

    <title>Playtron Experiment</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body>

    <main class="app">

        <!-- =====================================================
             HEADER
        ====================================================== -->

        <header class="header">

            <div class="header-info">

                <h1>
                    Playtron Experiment
                </h1>

                <p>
                    Experimental musical interface
                </p>

            </div>


            <div
                id="status"
                class="status"
            >
                TEST
            </div>

        </header>


        <!-- =====================================================
             TEST AREA
        ====================================================== -->

        <section class="controls">

            <button
                id="start-audio"
                type="button"
            >
                Démarrer le son
            </button>

        </section>


        <!-- =====================================================
             KEYBOARD
        ====================================================== -->

        <section class="instrument">

            <div
                id="keyboard"
                class="keyboard"
            >
                <!-- Generated by JavaScript -->
            </div>


            <div class="note-display">

                <span class="label">
                    LAST EVENT
                </span>


                <div
                    id="last-event"
                    class="last-event"
                >
                    —
                </div>

            </div>

        </section>


        <!-- =====================================================
             MAPPING
        ====================================================== -->

        <section class="mapping">

            <div class="section-title">
                KEYBOARD MAPPING
            </div>


            <div
                id="mapping-list"
                class="mapping-list"
            >
                <!-- Generated by JavaScript -->
            </div>

        </section>

    </main>


    <!-- =========================================================
         DIRECT HTML TEST
         Ce script est volontairement inline.
         Il permet de vérifier que le HTML fonctionne.
    ========================================================== -->

    <script>

        console.log("HTML INLINE : chargé");


        const testButton =
            document.querySelector("#start-audio");


        const testStatus =
            document.querySelector("#status");


        testButton.addEventListener("click", () => {

            console.log("HTML INLINE : bouton cliqué");


            testButton.textContent =
                "SON ACTIVÉ";


            testStatus.textContent =
                "TEST OK";

        });

    </script>


    <!-- =========================================================
         MAIN APPLICATION

         IMPORTANT :
         Nous ajoutons un paramètre ?v=2 pour éviter
         un éventuel problème de cache.
    ========================================================== -->

    <script
        src="./js/main.js?v=2"
    ></script>


</body>

</html>
