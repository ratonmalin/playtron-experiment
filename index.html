<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Experimental musical interface using keyboard and MIDI controllers."
    >

    <title>Playtron Experiment</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body>

    <main class="app">

        <!-- =====================================================
             HEADER
        ====================================================== -->

        <header class="header">

            <div class="header-info">

                <h1>
                    Playtron Experiment
                </h1>

                <p>
                    Keyboard prototype
                </p>

            </div>


            <div
                id="status"
                class="status"
            >
                AUDIO OFF
            </div>

        </header>


        <!-- =====================================================
             AUDIO CONTROLS
        ====================================================== -->

        <section
            class="controls"
            aria-label="Audio controls"
        >

            <button
                id="start-audio"
                type="button"
            >
                Démarrer le son
            </button>

        </section>


        <!-- =====================================================
             KEYBOARD
        ====================================================== -->

        <section
            class="instrument"
            aria-label="Musical keyboard"
        >

            <div
                id="keyboard"
                class="keyboard"
                aria-label="Keyboard"
            >
                <!-- Generated by JavaScript -->
            </div>


            <div class="note-display">

                <span class="label">
                    LAST EVENT
                </span>


                <div
                    id="last-event"
                    class="last-event"
                    aria-live="polite"
                >
                    —
                </div>

            </div>

        </section>


        <!-- =====================================================
             MAPPING
        ====================================================== -->

        <section
            class="mapping"
            aria-label="Keyboard mapping"
        >

            <div class="section-title">
                KEYBOARD MAPPING
            </div>


            <div
                id="mapping-list"
                class="mapping-list"
            >
                <!-- Generated by JavaScript -->
            </div>

        </section>

    </main>


    <!-- =========================================================
         APPLICATION LOADER

         On utilise ici un import dynamique plutôt que
         <script type="module" src="...">.
    ========================================================== -->

    <script>

        console.log(
            "[BOOT] Chargement de l'application..."
        );


        import("./js/main.js?v=3")
            .then(() => {

                console.log(
                    "[BOOT] Application chargée."
                );

            })
            .catch(error => {

                console.error(
                    "[BOOT ERROR]",
                    error
                );

                const status =
                    document.querySelector("#status");

                if (status) {

                    status.textContent =
                        "JS ERROR";

                }

            });

    </script>

</body>

</html>
