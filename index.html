<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Experimental musical interface using keyboard and MIDI controllers."
    >

    <title>Playtron Experiment</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <main class="app">

        <!--
            Application header
        -->

        <header class="header">

            <div class="header-info">

                <h1>
                    Playtron Experiment
                </h1>

                <p>
                    Keyboard prototype
                </p>

            </div>

            <div
                id="status"
                class="status"
            >
                AUDIO OFF
            </div>

        </header>


        <!--
            Audio controls
        -->

        <section
            class="controls"
            aria-label="Audio controls"
        >

            <button
                id="start-audio"
                type="button"
            >
                Démarrer le son
            </button>

        </section>


        <!--
            Main instrument
        -->

        <section
            class="instrument"
            aria-label="Musical keyboard"
        >

            <div
                id="keyboard"
                class="keyboard"
                aria-label="Keyboard mapping"
            >
                <!--
                    Keyboard keys are generated
                    by JavaScript.
                -->
            </div>


            <!--
                Last received internal event
            -->

            <div class="note-display">

                <span class="label">
                    LAST EVENT
                </span>

                <div
                    id="last-event"
                    class="last-event"
                    aria-live="polite"
                >
                    —
                </div>

            </div>

        </section>


        <!--
            Keyboard mapping
        -->

        <section
            class="mapping"
            aria-label="Keyboard mapping"
        >

            <div class="section-title">
                KEYBOARD MAPPING
            </div>

            <div
                id="mapping-list"
                class="mapping-list"
            >
                <!--
                    Mapping generated by JavaScript.
                -->
            </div>

        </section>

    </main>


    <!--
        JavaScript entry point.

        type="module" allows us to use
        ES modules and import/export.
    -->

    <script
        type="module"
        src="js/main.js"
    ></script>

</body>

</html>
