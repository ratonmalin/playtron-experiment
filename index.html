<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Experimental musical interface using keyboard and MIDI controllers.">
    <title>Playtron Experiment</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <main class="app">

        <header class="header">
            <div class="header-info">
                <h1>Playtron Experiment</h1>
                <p>Soft MIDI instrument · keyboard / Playtron</p>
            </div>

            <div id="status" class="status">
                READY
            </div>
        </header>

        <section class="controls" aria-label="Audio controls">
            <div class="control-intro">
                <span class="eyebrow">INSTRUMENT</span>
                <span class="hint">A Z E R T Y U I O P · Q S D F G H J · sustained notes</span>
            </div>
        </section>

        <div id="idle-message" class="idle-message" aria-hidden="true">
            réveillez-moi
        </div>

        <section class="instrument" aria-label="Musical keyboard">

            <div id="keyboard" class="keyboard" aria-label="Keyboard">
                <!-- Generated by JavaScript -->
            </div>

            <div class="note-display">
                <span class="label">LAST EVENT</span>
                <div id="last-event" class="last-event" aria-live="polite">
                    —
                </div>
            </div>

        </section>

        <footer class="technical-footer" aria-label="Technical information">
            <section class="mapping" aria-label="Keyboard mapping">
                <div class="section-title">KEYBOARD MAPPING</div>
                <div id="mapping-list" class="mapping-list">
                    <!-- Generated by JavaScript -->
                </div>
            </section>

            <section class="about">
                <div class="about-line">
                    <span>INPUT</span>
                    <span>KEYBOARD → MIDI EVENT BUS</span>
                </div>
                <div class="about-line">
                    <span>SOUND</span>
                    <span>3 OSCILLATORS · FILTER · LONG REVERB</span>
                </div>
                <div class="about-line">
                    <span>RANGE</span>
                    <span>C3 — A5</span>
                </div>
            </section>

            <section class="engine-info">
                <span id="engine-version">
                    ENGINE —
                </span>
            </section>
        </footer>
    </main>

    <script>
        const VERSION = Date.now();

        console.log("[BOOT] Version:", VERSION);
        console.log("[BOOT] Chargement de l'application...");

        import(`./js/main.js?v=${VERSION}`)
            .then(() => {
                console.log("[BOOT] Application chargée.");
            })
            .catch(error => {
                console.error("[BOOT ERROR]", error);

                const status = document.querySelector("#status");

                if (status) {
                    status.textContent = "JS ERROR";
                }
            });
    </script>

</body>

</html>
