<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Experimental musical interface using keyboard and MIDI controllers."
    >

    <title>Playtron Experiment</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >
</head>

<body>

    <main class="app">

        <header class="header">

            <div class="header-info">

                <h1>
                    Playtron Experiment
                </h1>

                <p>
                    Keyboard prototype
                </p>

            </div>

            <div
                id="status"
                class="status"
            >
                AUDIO OFF
            </div>

        </header>


        <section
            class="controls"
            aria-label="Audio controls"
        >

            <button
                id="start-audio"
                type="button"
            >
                Démarrer le son
            </button>

        </section>


        <section
            class="instrument"
            aria-label="Musical keyboard"
        >

            <div
                id="keyboard"
                class="keyboard"
            >
                <!-- Generated by JavaScript -->
            </div>

            <div class="note-display">

                <span class="label">
                    LAST EVENT
                </span>

                <div
                    id="last-event"
                    class="last-event"
                    aria-live="polite"
                >
                    —
                </div>

            </div>

        </section>


        <section
            class="mapping"
            aria-label="Keyboard mapping"
        >

            <div class="section-title">
                KEYBOARD MAPPING
            </div>

            <div
                id="mapping-list"
                class="mapping-list"
            >
                <!-- Generated by JavaScript -->
            </div>

        </section>

    </main>


    <!--
        TEST INLINE
        Permet de vérifier que le HTML et le bouton fonctionnent.
    -->

    <script>

        console.log("TEST HTML : script chargé");

        const testButton =
            document.querySelector("#start-audio");

        const testStatus =
            document.querySelector("#status");


        testButton.addEventListener("click", () => {

            console.log("TEST HTML : bouton cliqué");

            testButton.textContent =
                "SON ACTIVÉ";

            testStatus.textContent =
                "TEST OK";

        });

    </script>


    <!--
        MAIN APPLICATION
        Pour l'instant nous testons simplement son chargement.
    -->

    <script
        src="./js/main.js"
    ></script>

</body>

</html>
