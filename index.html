<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Playtron — Diagnostic</title>

</head>


<body>

    <h1>Diagnostic Playtron</h1>

    <p>
        Cette page sert uniquement à vérifier le chargement de JavaScript.
    </p>


    <hr>


    <h2>Test 1 — JavaScript intégré</h2>

    <button id="inline-test">
        Tester
    </button>

    <p id="inline-result">
        En attente…
    </p>


    <hr>


    <h2>Test 2 — Fichier main.js</h2>

    <p>
        Clique directement sur le lien ci-dessous :
    </p>

    <p>

        <a
            href="./js/main.js?v=123456"
            target="_blank"
        >
            OUVRIR js/main.js
        </a>

    </p>


    <hr>


    <h2>Test 3 — Chargement automatique</h2>

    <p id="external-result">
        En attente…
    </p>


    <script>

        /*
         * TEST INLINE
         */

        console.log(
            "TEST INLINE : OK"
        );


        const inlineButton =
            document.querySelector("#inline-test");


        const inlineResult =
            document.querySelector("#inline-result");


        inlineButton.addEventListener(
            "click",
            () => {

                inlineResult.textContent =
                    "Le JavaScript intégré fonctionne.";

            }
        );


        /*
         * INFORMATIONS SUR L'URL
         */

        console.log(
            "Page actuelle :",
            window.location.href
        );


        console.log(
            "Base URL :",
            document.baseURI
        );


        /*
         * TEST DU FICHIER EXTERNE
         */

        const script =
            document.createElement("script");


        script.src =
            "./js/main.js?v=123456";


        script.onload = () => {

            console.log(
                "MAIN.JS : fichier chargé"
            );

        };


        script.onerror = (error) => {

            console.error(
                "MAIN.JS : IMPOSSIBLE DE CHARGER LE FICHIER",
                error
            );


            document.querySelector(
                "#external-result"
            ).textContent =
                "ERREUR : main.js n'a pas pu être chargé.";

        };


        document.body.appendChild(script);

    </script>

</body>

</html>
