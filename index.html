<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Experimental musical interface using keyboard and MIDI controllers.">
    <title>Playtron Experiment - Corps Célestes</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <main class="app">
        <div id="idle-message" class="idle-message" aria-hidden="true"></div>

        <header class="header">
            <div class="header-info">
                <h1>Playtron Experiment - Corps Célestes</h1>
                <p>Soft MIDI instrument · keyboard / Playtron - Camille Grigaut</p>
            </div>

            <div class="header-actions">
                <button
                    id="scale-button"
                    class="scale-button"
                    type="button"
                    aria-label="Changer de gamme"
                    title="Changer de gamme"
                >
                    GAMME · MAJEURE
                </button>

                <button
                    id="fullscreen-button"
                    class="fullscreen-button"
                    type="button"
                    aria-label="Passer en plein écran"
                    title="Plein écran"
                >
                    FULL SCREEN
                </button>
            </div>
        </header>

        <section class="controls" aria-label="Audio controls">
            <div class="control-intro">
                <span class="eyebrow">INSTRUMENT</span>
                <span class="hint">A Z E R T Y U I O P · Q S D F G H J · sustained notes</span>
            </div>
        </section>

        <section class="instrument" aria-label="Musical keyboard">

            <div id="keyboard" class="keyboard" aria-label="Keyboard">
                <!-- Generated by JavaScript -->
            </div>

            <div class="note-display">
                <span class="label">LAST EVENT</span>
                <div id="last-event" class="last-event" aria-live="polite">
                    —
                </div>
            </div>

        </section>

    </main>

    <script>
        const VERSION = Date.now();

        console.log("[BOOT] Version:", VERSION);
        console.log("[BOOT] Chargement de l'application...");

        import(`./js/main.js?v=${VERSION}`)
            .then(() => {
                console.log("[BOOT] Application chargée.");
            })
            .catch(error => {
                console.error("[BOOT ERROR]", error);
            });
    </script>

</body>

</html>
