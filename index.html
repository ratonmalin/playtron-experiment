<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Playtron Experiment</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="app">

        <header class="header">

            <div>
                <h1>Playtron Experiment</h1>
                <p>Keyboard prototype</p>
            </div>

            <div id="status" class="status">
                AUDIO OFF
            </div>

        </header>


        <section class="controls">

            <button
                id="start-audio"
                type="button"
            >
                Démarrer le son
            </button>

        </section>


        <section class="instrument">

            <div
                id="keyboard"
                class="keyboard"
            ></div>

            <div class="note-display">

                <span class="label">
                    LAST EVENT
                </span>

                <div
                    id="last-event"
                    class="last-event"
                >
                    —
                </div>

            </div>

        </section>


        <section class="mapping">

            <div class="section-title">
                KEYBOARD MAPPING
            </div>

            <div
                id="mapping-list"
                class="mapping-list"
            ></div>

        </section>

    </main>


    <!--
        TEST DIRECT DU BOUTON
        Ce script ne dépend d'AUCUN autre fichier.
    -->

    <script>

        console.log("TEST HTML : script chargé");

        const button =
            document.querySelector("#start-audio");

        const status =
            document.querySelector("#status");


        button.addEventListener("click", () => {

            console.log("TEST HTML : bouton cliqué");

            button.textContent =
                "SON ACTIVÉ";

            status.textContent =
                "TEST OK";

        });

    </script>


    <!--
        Notre application principale
    -->

    <script
        type="module"
        src="./js/main.js"
    ></script>

</body>

</html>
